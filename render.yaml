# Render Blueprint — deploys every microservice + the frontend in one go.
#
# NOTE: Render's Blueprint schema evolves; double-check field names here
# (especially `fromService`/`property`, and whether static sites still use
# `type: static` vs `runtime: static`) against Render's current render.yaml
# reference before deploying: https://render.com/docs/blueprint-spec
#
# Data lives in Neon Postgres now (see DATABASE_URL below), not on a local
# disk, so none of these services need an attached disk. Every service is
# on Render's `free` plan (no card on file, by explicit choice) — the
# tradeoff: Render's free instance type spins down after 15 minutes idle,
# which for reminder-service specifically means the node-cron reminder
# dispatch loop silently stops firing while it's asleep and only resumes
# once something wakes the service back up (e.g. the next inbound request,
# or a booking that calls it). Move reminder-service (and ideally patient/
# dentist/appointment-service, which it depends on) to `starter` once
# billing is set up, to keep reminders firing on schedule.
#
# DATABASE_URL values below are placeholders — replace each with that
# service's own Neon connection string (one Neon project, 5 separate
# databases: patient_service / dentist_service / appointment_service /
# reminder_service / auth_service) via the Render dashboard, not by editing
# this file, since they're secrets.
#
# REDIS_URL (also a secret, set via the dashboard) is optional on every
# service that declares it — each one fails open and works identically
# (just without the read-through cache speedup) if it's left unset. One
# shared Redis instance is fine across all 5 services; cache keys are
# namespaced per service (e.g. "report-service:summary:...").
#
# IMPORTANT — inter-service URLs are hardcoded public https:// URLs below,
# NOT `fromService: {property: hostport}`. That's deliberate, not an
# oversight: `hostport` resolves to Render's *private* network address
# (e.g. "appointment-service-wgwd:10000", no scheme), and free-tier web
# services can *send* private-network requests but can't *receive* them
# (https://render.com/docs/private-network — "Free web services ... can't
# receive [private network requests]"). Every service here is on `free`,
# so any service-to-service call over the private network — including
# gateway's own aggregated health check (src/health.js), which fans out
# to every backend service — just hangs forever. Routing
# these calls over the public internet instead works fine on `free`, at
# the cost of a bit more latency than the private network would give.
# Move back to `fromService`/`hostport` if/when every service is upgraded
# off `free`.
#
# Each public URL below is only correct for *this* deployment — Render
# appends a random suffix (e.g. "-wgwd") to a service's onrender.com
# subdomain whenever the plain name is already taken (which happened for
# every service here except dentist-service). If you tear down and
# recreate these services from scratch, the new suffixes won't match what's
# hardcoded below — check each service's actual URL in the Render
# dashboard after deploying and update every `value:` that references it
# (both the envVars below and the static sites' `routes` further down).

services:
  - type: web
    name: patient-service
    runtime: node
    plan: free
    region: oregon
    rootDir: services/patient-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.9.0
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: APPOINTMENT_SERVICE_URL
        value: https://appointment-service-wgwd.onrender.com
      - key: DENTIST_SERVICE_URL
        value: https://dentist-service.onrender.com

  - type: web
    name: dentist-service
    runtime: node
    plan: free
    region: oregon
    rootDir: services/dentist-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.9.0
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: APPOINTMENT_SERVICE_URL
        value: https://appointment-service-wgwd.onrender.com
      - key: NOTIFICATION_SERVICE_URL
        value: https://notification-service-18oo.onrender.com
      - key: CLINIC_NAME
        value: Bright Smile Dental
      - key: CLINIC_PHONE
        value: (555) 012-3456
      - key: CLINIC_ADDRESS
        value: 12 Riverside Ave, Springfield
      # Inbox that receives the "new website inquiry" notification sent by
      # the patient-frontend contact form — distinct from notification-
      # service's MAIL_FROM (the outgoing send-as address).
      - key: CLINIC_NOTIFY_EMAIL
        value: front-desk@example.com

  - type: web
    name: appointment-service
    runtime: node
    plan: free
    region: oregon
    rootDir: services/appointment-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.9.0
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PATIENT_SERVICE_URL
        value: https://patient-service-xkz0.onrender.com
      - key: DENTIST_SERVICE_URL
        value: https://dentist-service.onrender.com
      - key: REMINDER_SERVICE_URL
        value: https://reminder-service-55dd.onrender.com
      - key: NOTIFICATION_SERVICE_URL
        value: https://notification-service-18oo.onrender.com
      - key: CLINIC_NAME
        value: Bright Smile Dental
      - key: CLINIC_PHONE
        value: (555) 012-3456
      - key: CLINIC_ADDRESS
        value: 12 Riverside Ave, Springfield
      - key: SEED_TOKEN
        generateValue: true

  - type: web
    name: reminder-service
    runtime: node
    plan: free
    region: oregon
    rootDir: services/reminder-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.9.0
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NOTIFICATION_SERVICE_URL
        value: https://notification-service-18oo.onrender.com
      - key: REMINDER_OFFSETS_HOURS
        value: "48,2"
      - key: REMINDER_CRON
        value: "* * * * *"
      - key: CLINIC_NAME
        value: Bright Smile Dental
      - key: CLINIC_PHONE
        value: (555) 012-3456
      - key: CLINIC_ADDRESS
        value: 12 Riverside Ave, Springfield

  - type: web
    name: notification-service
    runtime: node
    plan: free
    region: oregon
    rootDir: services/notification-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.9.0
      # Render's free plan blocks outbound SMTP (ports 25/465/587) entirely
      # (https://render.com/changelog/free-web-services-will-no-longer-allow-outbound-traffic-to-smtp-ports),
      # so the SMTP_* vars below never work here even with correct
      # credentials — confirmed by a "Connection timeout" from every send
      # attempt. SENDGRID_API_KEY (HTTPS, not blocked) is what actually
      # delivers email on this deploy — tried first (see mailer.js), falling
      # back to RESEND_API_KEY then SMTP_*. SendGrid is preferred because its
      # free tier's Single Sender Verification (Settings > Sender
      # Authentication, no domain needed) lets one verified email send to
      # ANY recipient; Resend's sandbox mode without a verified domain can
      # only ever send to its own account's email. SMTP_* stays configurable
      # for local dev or a non-free-tier deploy, where it does work.
      - key: SENDGRID_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        sync: false
      # Until a sending domain is verified in Resend, sandbox mode only
      # allows "onboarding@resend.dev" as the from-address (and only
      # delivers to the email your Resend account itself is registered
      # under) — real patient delivery needs a verified domain there.
      - key: MAIL_FROM
        value: "Bright Smile Dental <no-reply@brightsmile.example>"
      # Twilio SMS — optional, same fail-soft posture as SMTP above: leave
      # blank and SMS sending is silently disabled (emails keep working).
      # Auth is the main Auth Token, not an API Key SID/Secret pair — Twilio
      # API Keys require a paid (non-Trial) account; see
      # notification-service/.env.example for the full explanation.
      # TWILIO_FROM_NUMBER must be a number this Twilio account owns.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

  - type: web
    name: auth-service
    runtime: node
    plan: free
    region: oregon
    rootDir: services/auth-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.9.0
      - key: DATABASE_URL
        sync: false
      # MUST be set to the exact same value as the gateway service's own
      # JWT_SECRET below — the gateway verifies tokens this service issues
      # without calling back here (see services/gateway/src/auth.js), so a
      # mismatch between the two makes every login look invalid at the
      # gateway even though auth-service issued it correctly. Render can't
      # share one generated secret across two services in this Blueprint
      # format, so generate one value yourself and paste it into both
      # services' dashboards — same reasoning as DATABASE_URL above.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DENTIST_SERVICE_URL
        value: https://dentist-service.onrender.com
      - key: NOTIFICATION_SERVICE_URL
        value: https://notification-service-18oo.onrender.com
      # The staff dashboard's public URL — password reset emails link to
      # <FRONTEND_URL>/reset-password?token=...; only staff (admin/doctor)
      # accounts exist, so this always points at the admin dashboard, never
      # patient-frontend. The dashboard is single-origin now: it's served
      # under /v1/admin off patient-frontend's own domain (see that
      # service's routes below), so links point there rather than at the
      # `frontend` service's own onrender.com URL directly.
      - key: FRONTEND_URL
        value: https://patient-frontend-27om.onrender.com/v1/admin
      - key: CLINIC_NAME
        value: Bright Smile Dental
      - key: CLINIC_PHONE
        value: (555) 012-3456
      - key: CLINIC_ADDRESS
        value: 12 Riverside Ave, Springfield
      - key: SEED_TOKEN
        generateValue: true

  - type: web
    name: report-service
    runtime: node
    plan: free
    region: oregon
    rootDir: services/report-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.9.0
      - key: REDIS_URL
        sync: false
      - key: PATIENT_SERVICE_URL
        value: https://patient-service-xkz0.onrender.com
      - key: DENTIST_SERVICE_URL
        value: https://dentist-service.onrender.com
      - key: APPOINTMENT_SERVICE_URL
        value: https://appointment-service-wgwd.onrender.com
      - key: REMINDER_SERVICE_URL
        value: https://reminder-service-55dd.onrender.com
      - key: CLINIC_NAME
        value: Bright Smile Dental
      - key: CLINIC_PHONE
        value: (555) 012-3456
      - key: CLINIC_ADDRESS
        value: 12 Riverside Ave, Springfield

  - type: web
    name: gateway
    runtime: node
    plan: free
    region: oregon
    rootDir: services/gateway
    buildCommand: npm install
    startCommand: npm start
    # NOT /api/health — that endpoint fans out to every backend service
    # (see src/health.js) and, with several free-tier services cold at
    # once, could run long enough that Render decided gateway itself was
    # unhealthy and pulled it out of rotation (traffic silently blackholed
    # even though the process was up). /api/live is a zero-dependency
    # liveness check that can only ever be as slow as gateway's own event
    # loop.
    healthCheckPath: /api/live
    envVars:
      - key: NODE_VERSION
        value: 22.9.0
      - key: PATIENT_SERVICE_URL
        value: https://patient-service-xkz0.onrender.com
      - key: DENTIST_SERVICE_URL
        value: https://dentist-service.onrender.com
      - key: APPOINTMENT_SERVICE_URL
        value: https://appointment-service-wgwd.onrender.com
      - key: REMINDER_SERVICE_URL
        value: https://reminder-service-55dd.onrender.com
      - key: REPORT_SERVICE_URL
        value: https://report-service-8q0p.onrender.com
      - key: AUTH_SERVICE_URL
        value: https://auth-service-e0iz.onrender.com
      # MUST be set to the exact same value pasted into auth-service's own
      # JWT_SECRET above — see that service's comment for why.
      - key: JWT_SECRET
        sync: false
      - key: CLINIC_NAME
        value: Bright Smile Dental
      # Powers POST /api/chat (the patient-frontend chat widget). Server-side
      # only — never sent to either frontend. Leave unset to disable the
      # chatbot (the endpoint 503s instead of the gateway crashing).
      - key: GEMINI_API_KEY
        sync: false

  # Staff admin dashboard. Built with `basePath: '/v1/admin'` (see
  # frontend/next.config.mjs) so every internal link/asset URL *inside* the
  # built HTML/JS is prefixed with /v1/admin — but `next build`'s static
  # export still writes the actual files flat at the root of `out/`
  # (out/index.html, out/_next/*, out/dentists.html, ...; basePath does NOT
  # nest the output directory itself, only the references baked into it).
  # So this service's own routing has to translate incoming /v1/admin/*
  # requests back down to that flat layout:
  #   - /v1/admin/_next/*  -> the real built assets at /_next/* (MUST come
  #     before the catch-all below, or JS/CSS requests would get HTML back)
  #   - /v1/admin/*        -> /index.html, the same SPA-fallback pattern
  #     this route used pre-basePath, just under the new prefix
  # This lets the app work identically whether it's hit directly at this
  # service's own onrender.com URL or reverse-proxied in from
  # patient-frontend's origin (see that service's /v1/admin/* rewrite
  # below) — same static build either way, no separate basePath-less build
  # needed. The /api/* rewrite's destination is the gateway's actual public
  # URL — see the file-level comment above on why this can't be
  # `fromService` and why it needs re-checking after a fresh deploy.
  #
  # NOTE on wildcard substitution: Render's own syntax for "whatever the
  # source's `*` matched" is a bare `*` in the destination — NOT `:splat`
  # (that's Netlify's convention, and it doesn't work here: Render forwards
  # it as the literal 7-character string ":splat", confirmed by logging
  # gateway's raw incoming req.url and seeing exactly "/api/:splat" arrive
  # unsubstituted, on every combination of slash placement around it).
  #
  # SECOND wildcard gotcha, specific to the /v1/admin/_next/* rule below:
  # `*` substitution only works when the destination is a full external
  # URL — a same-site *local* path destination that also uses `*` (like
  # the seemingly obvious `/_next/*`) never gets the wildcard substituted
  # and 404s on every asset, even though this service's own `/*` ->
  # `/index.html` and `/v1/admin/*` -> `/index.html` rules (fixed,
  # non-wildcard destinations) work fine. Confirmed by switching this one
  # rule's destination to this service's own full https:// URL — that
  # immediately started returning 200s where the local-path form 404'd on
  # the identical request. So this rule points at itself by full URL
  # instead of a local path; keep it that way.
  - type: web
    name: frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: out
    routes:
      - type: rewrite
        source: /api/*
        destination: https://gateway-6w4f.onrender.com/api/*
      - type: rewrite
        source: /v1/admin/_next/*
        destination: https://frontend-kj54.onrender.com/_next/*
      - type: rewrite
        source: /v1/admin/*
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html

  # Public patient-facing site — the primary site, serving the root domain.
  # Also fronts the staff admin dashboard at /v1/admin/* by reverse-proxying
  # to the `frontend` service above, so both apps are reachable from this
  # one origin/port in production (matching the local dev-proxy in
  # scripts/dev-proxy.js). That rewrite MUST come before the `/*` catch-all
  # below (first matching route wins) — its destination is the `frontend`
  # service's actual public URL, same caveat as the /api/* destination
  # above matching the gateway's.
  - type: web
    name: patient-frontend
    runtime: static
    rootDir: patient-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: out
    routes:
      - type: rewrite
        source: /api/*
        destination: https://gateway-6w4f.onrender.com/api/*
      # Routes admin asset requests straight to frontend's own flat /_next/*
      # output in one hop, bypassing frontend's own /v1/admin/_next/* rule
      # entirely (must come before the broader /v1/admin/* rule below —
      # first match wins). That's deliberate: frontend's own version of this
      # rule points at its own full https:// URL (required — see that
      # service's note on why a local-path destination never works), and a
      # rewrite destination pointing a service at *itself* by full URL
      # degrades under repeated real traffic — every asset started
      # returning `Content-Length: 0` after a handful of requests, breaking
      # the whole admin dashboard (blank page, confirmed by inspecting
      # response headers directly, not just the browser). Going straight
      # from patient-frontend to frontend (a normal cross-service external
      # rewrite, the same pattern the /api/* rule above already uses
      # reliably) avoids the self-reference entirely. Only fixes the
      # primary path through patient-frontend — hitting frontend's own
      # onrender.com URL directly for /v1/admin/* still goes through its
      # own (fragile) rule; always use the root domain in production.
      # Render's `/v1/admin/*` rule below does NOT match the bare path
      # `/v1/admin` (no trailing slash, nothing after it) — confirmed by
      # hitting it directly: it fell through all the way to the final `/*`
      # catch-all and served patient-frontend's own home page instead of
      # the dashboard. That path is exactly what a fresh browser load of
      # the admin root produces (bookmark, hard refresh, or the app's own
      # post-login `router.replace('/')`, which resolves to `/v1/admin`
      # under this basePath) — needs its own exact-match rule, not folded
      # into the wildcard one below.
      - type: rewrite
        source: /v1/admin
        destination: https://frontend-kj54.onrender.com/
      - type: rewrite
        source: /v1/admin/_next/*
        destination: https://frontend-kj54.onrender.com/_next/*
      # Routes every other admin PAGE straight to frontend's own flat,
      # un-prefixed static file for that route (out/login.html,
      # out/dentists.html, ...) instead of through frontend's own
      # /v1/admin/* -> /index.html rule. That rule is a single-page-app
      # catch-all, but this is a Next.js App Router *static export* — every
      # route gets its own separately pre-rendered HTML file, not one SPA
      # shell — so unconditionally serving /index.html for every path under
      # /v1/admin/* actually served the DASHBOARD route's ('/') markup for
      # every admin page, /login included. Once the earlier hydration fix
      # made the page actually mount, this surfaced as the dashboard's own
      # loading skeleton rendering at the /login URL, not a login form —
      # found by inspecting the mounted React tree, not just eyeballing a
      # blank screen. Stripping the /v1/admin prefix and letting frontend's
      # own normal static-file serving resolve the real per-route file
      # fixes it; same reasoning as the asset rule above for why this must
      # be a cross-service external URL, not a local path.
      - type: rewrite
        source: /v1/admin/*
        destination: https://frontend-kj54.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
